<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가사 창 설정</title>
  <link rel="stylesheet" href="lyrics-settings.css" />
</head>
<body>
  <main id="lyrics-settings-app">
    <header class="settings-head">
      <div>
        <h1>가사 창 설정</h1>
        <p>변경한 값은 즉시 가사 창에 반영됩니다.</p>
      </div>
      <button id="settings-close" class="settings-close" type="button" title="닫기" aria-label="닫기">×</button>
    </header>

    <section class="settings-section">
      <h2>크기 및 모양</h2>
      <div class="settings-size-grid">
        <label>
          <span>가로 길이</span>
          <div class="number-input"><input id="setting-width" type="number" min="360" max="1400" step="1" /><em>px</em></div>
        </label>
        <label>
          <span>세로 길이</span>
          <div class="number-input"><input id="setting-height" type="number" min="150" max="700" step="1" /><em>px</em></div>
        </label>
      </div>
      <label class="range-setting">
        <span>백그라운드 투명도 <output id="setting-opacity-value"></output></span>
        <input id="setting-opacity" type="range" min="0" max="100" step="1" />
      </label>
      <label class="range-setting">
        <span>글씨 크기 <output id="setting-font-size-value"></output></span>
        <input id="setting-font-size" type="range" min="10" max="48" step="1" />
      </label>
    </section>

    <section class="settings-section">
      <h2>표시 항목 및 컨트롤</h2>
      <div class="settings-toggle-grid">
        <label><input id="setting-progress" type="checkbox" /> 재생바 표시</label>
        <label><input id="setting-playback" type="checkbox" /> 재생 컨트롤 표시</label>
        <label><input id="setting-previous" type="checkbox" /> 이전 곡 버튼</label>
        <label><input id="setting-pause" type="checkbox" /> 일시정지/재생 버튼</label>
        <label><input id="setting-next" type="checkbox" /> 다음 곡 버튼</label>
        <label><input id="setting-track-info" type="checkbox" /> 곡 정보 표시</label>
        <label><input id="setting-cover" type="checkbox" /> 앨범 이미지 표시</label>
        <label><input id="setting-status" type="checkbox" /> 상태 문구 표시</label>
        <label><input id="setting-topmost" type="checkbox" /> 항상 위에 표시</label>
      </div>
    </section>

    <button id="settings-reset" class="settings-reset" type="button">기본값으로 되돌리기</button>
  </main>
  <script src="lyrics-settings.js"></script>
</body>
</html>
